; ==========================================================================
; Fantasy Card Battle - Default Engine Configuration
; Unreal Engine 5.8 | Target: Android (Mobile/Tablet, Scalable 3D or 2D)
; Single Player | Offline | No online/backend systems
; ==========================================================================

; --------------------------------------------------------------------------
; Maps & Modes
; - Default maps are /Game/Maps/MainMenu and /Game/Maps/Battle
;   (create these two levels in the editor - see docs/phase-01-setup.md)
; - Global default GameMode: ACardGameGameMode (C++)
; - GameInstance: UCardGameGameInstance (C++)
; --------------------------------------------------------------------------
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/MainMenu.MainMenu
GameDefaultMap=/Game/Maps/MainMenu.MainMenu
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/CardGame.CardGameGameMode
GameInstanceClass=/Script/CardGame.CardGameGameInstance
bUseSplitscreen=False

; --------------------------------------------------------------------------
; Target hardware: Mobile/Tablet + Scalable 3D or 2D
; (equivalent to selecting "Mobile / Scalable 3D or 2D" in the project wizard)
; --------------------------------------------------------------------------
[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

; --------------------------------------------------------------------------
; Scalable rendering defaults (match the "Scalable 3D or 2D" template)
; --------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=0

; --------------------------------------------------------------------------
; Android packaging / device settings
; - Portrait orientation for a card game (change to Landscape if desired)
; - Package name: change Company/Project parts before shipping
; - Min install SDK 26 (Android 8+), target SDK 35 (UE 5.8 recommendation)
; --------------------------------------------------------------------------
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.cardgame.fantasycardbattle
Orientation=Portrait
bFullScreen=True
MinSDKVersion=26
TargetSDKVersion=35
bBuildForArm64=True
